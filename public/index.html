    @import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@400;500;600;700;800&display=swap');

    main{padding:35px clamp(22px,5vw,70px) 60px;max-width:1210px;width:100%;margin:auto}.topline{display:flex;justify-content:space-between;align-items:center;margin-bottom:32px}.crumb{color:var(--muted);font-size:12px}.todaydate{color:#73796f;font-size:12px}.greeting{display:flex;justify-content:space-between;align-items:flex-end;margin-bottom:28px}.eyebrow{font-size:11px;text-transform:uppercase;letter-spacing:1.2px;color:var(--green);font-weight:700}.greeting h1{font:700 clamp(26px,3vw,36px) Manrope;letter-spacing:-1.1px;margin:7px 0 7px}.greeting p{color:var(--muted);margin:0}.roundbtn{border:1px solid var(--line);background:#fff;border-radius:9px;padding:10px 14px;color:#586455}.overview{display:grid;grid-template-columns:1.6fr 1fr;gap:16px;margin-bottom:28px}.hero-card,.stats-card,.task-panel{background:#fff;border:1px solid var(--line);border-radius:15px;box-shadow:var(--shadow)}.hero-card{padding:22px 24px;display:grid;grid-template-columns:1fr 105px;align-items:center;min-height:150px;background:linear-gradient(115deg,#f1f5ef,#fbfcfa)}.hero-card h2{font:700 18px Manrope;margin:0 0 7px}.hero-card p{color:var(--muted);font-size:12px;margin:0}.progress{width:88px;height:88px;border-radius:50%;background:conic-gradient(var(--green) var(--percent,0%),#e1e8df 0);display:grid;place-items:center;position:relative}.progress:before{content:'';position:absolute;inset:8px;background:#f4f7f2;border-radius:50%}.progress span{position:relative;font:800 22px Manrope}.progress small{display:block;font:500 9px 'DM Sans';text-align:center;color:var(--muted)}.stats-card{padding:19px 21px;display:flex;align-items:center;justify-content:space-between}.stats-card .stat-label{font-size:11px;color:var(--muted)}.stats-card strong{display:block;font:700 28px Manrope;margin:8px 0 2px}.stats-card .stat-note{font-size:11px;color:#84907d}.stat-icon{width:42px;height:42px;border-radius:12px;background:#eff3e9;display:grid;place-items:center;font-size:20px}
    .panelhead{display:flex;justify-content:space-between;align-items:center;margin:0 0 15px}.panelhead h2{font:700 17px Manrope;margin:0}.panelhead p{color:var(--muted);font-size:11px;margin:5px 0 0}.add-form{display:grid;grid-template-columns:minmax(140px,1fr) 120px 155px auto;gap:9px;margin-bottom:17px}.add-form input,.add-form select,.edit-select{height:42px;border:1px solid var(--line);border-radius:8px;background:#fff;padding:0 12px;color:var(--ink);outline:none}.add-form input:focus,.add-form select:focus{border-color:#86a38a;box-shadow:0 0 0 3px #4d745814}.primary{border:0;border-radius:8px;padding:0 17px;background:#34563c;color:white;font-weight:600}.primary:hover{background:#28482f}.tasks{display:grid;gap:8px}.task{border:1px solid var(--line);border-radius:10px;padding:13px 14px;display:grid;grid-template-columns:21px minmax(0,1fr) auto;align-items:center;gap:11px;transition:.15s}.task:hover{border-color:#cbd6c9;transform:translateY(-1px)}.check{width:18px;height:18px;border:1.5px solid #c5cbc1;border-radius:6px;background:#fff;color:#fff;padding:0;display:grid;place-items:center}.task.done .check{background:var(--green);border-color:var(--green)}.task.done .task-title{text-decoration:line-through;color:#a0a59c}.task-title{font-weight:600;font-size:13px;overflow-wrap:anywhere}.task-meta{display:flex;gap:7px;align-items:center;margin-top:6px;color:var(--muted);font-size:10px}.badge{padding:4px 7px;border-radius:5px;background:#f1f2ef;color:#788071;font-weight:700;text-transform:capitalize}.badge.urgent{background:#fcece8;color:#bd624e}.badge.high{background:#fff1e7;color:#c57942}.badge.low{background:#edf3f7;color:#6b8794}.due.overdue{color:#bf644f}.task-actions{display:flex;gap:5px}.iconbtn{width:30px;height:30px;border:0;background:transparent;border-radius:7px;color:#8e958a}.iconbtn:hover{background:#f0f2ed;color:#475b49}.task-edit{display:flex;gap:7px;align-items:center}.task-edit input{height:34px;min-width:120px;width:100%;border:1px solid var(--line);border-radius:6px;padding:0 7px}.task-edit select{height:34px;border:1px solid var(--line);border-radius:6px;padding:0 5px}.empty{padding:42px 15px;text-align:center;color:var(--muted);border:1px dashed #dce1d8;border-radius:10px}.empty .empty-icon{font-size:29px;margin-bottom:10px}.empty strong{display:block;color:#50594e;margin-bottom:5px}.toast{position:fixed;right:22px;bottom:22px;background:#263d2b;color:#fff;padding:12px 17px;border-radius:9px;box-shadow:var(--shadow);z-index:8}.error{color:#b55448;font-size:12px;margin:0 0 12px}.footer{margin-top:18px;color:#9ba097;font-size:10px;text-align:right}
    .auth-wrap{min-height:100vh;display:grid;place-items:center;padding:22px;background:radial-gradient(ellipse at 18% 18%,#eaf0e7,transparent 37%),var(--canvas)}.auth-card{width:min(100%,410px);padding:34px;background:#fff;border:1px solid var(--line);border-radius:18px;box-shadow:0 25px 70px #24322212}.auth-card .brand{padding:0;margin-bottom:32px}.auth-card h1{font:700 25px Manrope;margin:0 0 7px}.auth-card>p{color:var(--muted);font-size:13px;line-height:1.6;margin:0 0 23px}.field{display:grid;gap:7px;margin-bottom:15px}.field label{font-weight:600;font-size:12px}.field input{height:44px;border:1px solid var(--line);border-radius:8px;padding:0 12px;outline:none}.field input:focus{border-color:#86a38a;box-shadow:0 0 0 3px #4d745814}.auth-submit{height:44px;width:100%;margin-top:4px}.auth-switch{text-align:center;color:var(--muted);font-size:12px;margin-top:18px}.linkbtn{border:0;background:none;color:var(--green);font-weight:700;padding:0}.auth-note{border-top:1px solid var(--line);margin-top:22px;padding-top:15px;color:#969b92;font-size:10px;line-height:1.5}.loading{min-height:100vh;display:grid;place-items:center;color:var(--muted)}
    @media(max-width:850px){.shell{grid-template-columns:70px minmax(0,1fr)}aside{padding:22px 9px}.brand{justify-content:center;padding:0 0 32px}.brand-copy,.section-label,.nav .label,.nav .count,.tip,.userbox .identity,.userbox>button{display:none}.nav button{justify-content:center;padding:12px 0}.nav .ico{font-size:19px}.userbox{justify-content:center;padding:16px 0 0}.overview{grid-template-columns:1fr 1fr}.hero-card{grid-column:1/-1}.add-form{grid-template-columns:1fr 1fr}.add-form input:first-child{grid-column:1/-1}.add-form button{height:42px}}
    @media(max-width:560px){main{padding:23px 15px 45px}.topline{margin-bottom:25px}.greeting{align-items:flex-start}.greeting .roundbtn{font-size:11px;padding:8px}.overview{gap:9px}.hero-card{padding:17px;grid-template-columns:1fr 78px;min-height:127px}.progress{width:70px;height:70px}.progress span{font-size:18px}.stats-card{padding:15px}.stats-card strong{font-size:24px}.stats-card .stat-note{font-size:9px}.add-form{gap:7px}.task{padding:11px 9px;gap:8px}.task-actions .iconbtn{width:26px}.task-edit{grid-column:1/-1;flex-wrap:wrap}.task-edit input{flex:1 1 100%}}
    .tools-row{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:-12px 0 26px}.tool-card{background:#fff;border:1px solid var(--line);border-radius:12px;padding:14px 16px;display:flex;align-items:center;gap:12px;box-shadow:var(--shadow)}.tool-icon{width:38px;height:38px;border-radius:11px;background:#f0f4ee;display:grid;place-items:center;color:#45664b;font-size:17px}.tool-info{min-width:0;flex:1}.tool-info strong{display:block;font-size:12px}.tool-info small{display:block;color:var(--muted);font-size:10px;margin-top:4px}.tool-card button{border:1px solid var(--line);background:#fff;border-radius:7px;padding:7px 10px;color:#526050;font-size:11px;font-weight:600}.tool-card button:hover{background:#f4f6f2}.dialog-backdrop{position:fixed;inset:0;background:#17201865;display:grid;place-items:center;padding:20px;z-index:10}.dialog{background:#fff;width:min(100%,440px);border-radius:16px;padding:22px;box-shadow:0 24px 80px #1115;max-height:85vh;overflow:auto}.dialog-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:17px}.dialog-head h2{font:700 18px Manrope;margin:0}.dialog-head button{border:0;background:none;color:#858a81;font-size:20px}.dialog-form{display:grid;gap:10px}.dialog-form input{height:42px;border:1px solid var(--line);border-radius:8px;padding:0 11px}.dialog-form button{height:42px}.reminder-list{display:grid;gap:8px;margin-top:16px}.reminder-item{display:flex;justify-content:space-between;align-items:center;gap:12px;background:#f7f8f5;padding:11px;border-radius:8px}.reminder-item strong{font-size:12px}.reminder-item small{display:block;font-size:10px;color:var(--muted);margin-top:4px}.reminder-item button{border:0;background:transparent;color:#969b92;font-size:17px}.dialog-note{margin:13px 0 0;color:#91968d;font-size:10px;line-height:1.5}.timer-controls{display:grid;grid-template-columns:1fr 1fr;gap:9px}.timer-controls button{height:40px}.timer-face{width:178px;height:178px;position:relative;margin:4px auto 16px;displ     @media(max-width:560px){.tools-row{gap:8px}.tool-card{padding:11px 9px;gap:8px}.tool-icon{width:32px;height:32px}.tool-card button{padding:7px}.tool-info small{font-size:9px}}
    .alarm-dialog{text-align:center;padding:30px 22px}.alarm-bell{font-size:42px;animation:bell-shake .55s infinite alternate;display:block;margin:4px 0 12px}.alarm-dialog p{color:var(--muted);font-size:13px;line-height:1.5}.alarm-dialog button{height:44px;min-width:155px}#timer-preview{grid-column:1/-1}@keyframes bell-shake{from{transform:rotate(-12deg)}to{transform:rotate(12deg)}}

<body><div id="app"><div class="loading">Opening FocusDesk…</div></div>
<script>
if ('serviceWorker' in navigator) addEventListener('load',()=>navigator.serviceWorker.register('/sw.js').catch(()=>{}));
const app=document.querySelector('#app');
const state={user:null,tasks:[],view:'overview',authMode:'register',editing:null,busy:false,dialog:null,alarmMessage:null,alarmInterval:null,audioContext:null,timerEnd:Number(localStorage.getItem('focusdesk-timer-end'))||0,timerMinutes:Number(localStorage.getItem('focusdesk-timer-minutes'))||25,timerDuration:Number(localStorage.getItem('focusdesk-timer-duration'))||25*60000,timerInterval:null};
const today=new Date();today.setHours(0,0,0,0);
const dayKey=(date)=>{const d=new Date(date);return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`};
const dateLabel=new Intl.DateTimeFormat(undefined,{weekday:'long',month:'long',day:'numeric'}).format(new Date());
const escapeHtml=(s)=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
async function api(path,options={}){const response=await fetch(path,{...options,headers:{'Content-Type':'application/json',...(options.headers||{})}});const body=await response.json().catch(()=>({}));if(!response.ok)throw new Error(body.error||'Something went wrong.');return body}
function fmtDate(value){if(!value)return 'No due date';return new Intl.DateTimeFormat(undefined,{month:'short',day:'numeric'}).format(new Date(value+'T12:00:00'))}
function reminders(){try{return JSON.parse(localStorage.getItem('focusdesk-reminders')||'[]')}catch{return []}}
function saveReminders(items){localStorage.setItem('focusdesk-reminders',JSON.stringify(items))}
function timerText(){if(!state.timerEnd)return 'A little focused time goes a long way.';const seconds=Math.max(0,Math.ceil((state.timerEnd-Date.now())/1000));return `Running · ${String(Math.floor(seconds/60)).padStart(2,'0')}:${String(seconds%60).padStart(2,'0')} left`}
function updateTimerRing(){const ring=document.querySelector('#timer-ring');if(!ring)return;const remaining=state.timerEnd?Math.max(0,state.timerEnd-Date.now()):state.timerDuration;const elapsed=1-Math.min(1,remaining/Math.max(1,state.timerDuration));ring.style.strokeDashoffset=String(440*elapsed)}
function prepareAudio(){try{const AudioContextClass=window.AudioContext||window.webkitAudioContext;if(!AudioContextClass)return;state.audioContext??=new AudioContextClass();if(state.audioContext.state==='suspended')state.audioContext.resume()}catch{}}
function playBellTone(frequency){if(!state.audioContext||state.audioContext.state!=='running')return;const now=state.audioContext.currentTime,oscillator=state.audioContext.createOscillator(),gain=state.audioContext.createGain();oscillator.type='sine';oscillator.frequency.value=frequency;gain.gain.setValueAtTime(.001,now);gain.gain.exponentialRampToValueAtTime(.16,now+.025);gain.gain.setValueAtTime(.16,now+.22);gain.gain.exponentialRampToValueAtTime(.001,now+.48);oscillator.connect(gain);gain.connect(state.audioContext.destination);oscillator.start(now);oscillator.stop(now+.5)}
function ringBell(){playBellTone(660);setTimeout(()=>playBellTone(880),320)}
function startAlarm(message){state.alarmMessage=message;state.dialog='alarm';prepareAudio();ringBell();if(state.alarmInterval)clearInterval(state.alarmInterval);state.alarmInterval=setInterval(ringBell,1400);try{if(Notification.permission==='granted')new Notification('FocusDesk alarm',{body:message})}catch{}render()}
function stopAlarm(){if(state.alarmInterval)clearInterval(state.alarmInterval);state.alarmInterval=null;state.alarmMessage=null;state.dialog=null;render()}
function dialogMarkup(){if(state.dialog==='alarm')return `<div class="dialog-backdrop"><section class="dialog alarm-dialog" role="alertdialog" aria-modal="true"><span class="alarm-bell" aria-hidden="true">🔔</span><h2>It’s time</h2><p>${escapeHtml(state.alarmMessage||'Your alarm is ringing.')}</p><button class="primary" id="alarm-stop">Stop alarm</button></section></div>`;if(state.dialog==='timer'){return `<div class="dialog-backdrop" id="dialog-backdrop"><section class="dialog"><div class="dialog-head"><h2>Focus timer</h2><button data-close aria-label="Close">×</button></div><div class="timer-face"><svg viewBox="0 0 180 180" role="img" aria-label="Timer progress"><circle class="timer-track" cx="90" cy="90" r="70"></circle><circle class="timer-ring" id="timer-ring" cx="90" cy="90" r="70"></circle></svg><div class="timer-display" id="timer-display">${state.timerEnd?timerText().split(' · ').pop().replace(' left',''):`${String(state.timerMinutes).padStart(2,'0')}:00`}</div></div><div class="timer-row"><input id="timer-minutes" type="number" min="1" max="180" value="${state.timerMinutes}" aria-label="Timer minutes"></div><p class="dialog-note">Set minutes (1–180), then start or restart. Keep this tab open while the timer runs.</p><div class="timer-controls"><button class="primary" id="timer-start">${state.timerEnd?'Restart':'Start focus'}</button><button class="roundbtn" id="timer-stop" style="height:40px">Stop</button><button class="roundbtn" id="timer-preview" style="height:40px">♪ &nbsp; Test sound</button></div></section></div>`}const items=reminders().sort((a,b)=>a.at.localeCompare(b.at));return `<div class="dialog-backdrop" id="dialog-backdrop"><section class="dialog"><div class="dialog-head"><h2>Gentle reminders</h2><button data-close aria-label="Close">×</button></div><form class="dialog-form" id="reminder-form"><input name="label" maxlength="80" placeholder="What should we remind you about?" required><input name="at" type="datetime-local" min="${new Date(Date.now()-new Date().getTimezoneOffset()*60000).toISOString().slice(0,16)}" required><button class="primary">＋ &nbsp; Schedule reminder</button><div class="modal-error" id="reminder-error"></div></form><div class="reminder-list">${items.length?items.map(item=>`<div class="reminder-item"><div><strong>${escapeHtml(item.label)}</strong><small>${new Intl.DateTimeFormat(undefined,{month:'short',day:'numeric',hour:'numeric',minute:'2-digit'}).format(new Date(item.at))}</small></div><button data-remove-reminder="${item.id}" aria-label="Remove reminder">×</button></div>`).join(''):'<div class="empty" style="padding:20px">No reminders scheduled yet.</div>'}</div><p class="dialog-note">Reminders are saved in this browser. Keep FocusDesk open for the alert; browser notifications are optional.</p></section></div>`}
function bindDialog(){if(!state.dialog)return;if(state.dialog==='alarm'){document.querySelector('#alarm-stop').onclick=stopAlarm;return}document.querySelector('[data-close]').onclick=()=>{state.dialog=null;render()};document.querySelector('#dialog-backdrop').onclick=e=>{if(e.target.id==='dialog-backdrop'){state.dialog=null;render()}};if(state.dialog==='timer'){updateTimerRing();const input=document.querySelector('#timer-minutes');input.oninput=()=>{const mins=Number(input.value);if(mins>=1&&mins<=180){state.timerMinutes=mins;localStorage.setItem('focusdesk-timer-minutes',String(mins));if(!state.timerEnd){state.timerDuration=mins*60000;document.querySelector('#timer-display').textContent=`${String(mins).padStart(2,'0')}:00`;updateTimerRing()}}};document.querySelector('#timer-start').onclick=()=>{prepareAudio();const mins=Math.min(180,Math.max(1,Number(input.value)||25));state.timerMinutes=mins;state.timerDuration=mins*60000;localStorage.setItem('focusdesk-timer-minutes',String(mins));localStorage.setItem('focusdesk-timer-duration',String(state.timerDuration));state.timerEnd=Date.now()+state.timerDuration;localStorage.setItem('focusdesk-timer-end',String(state.timerEnd));if(Notification.permission==='default')Notification.requestPermission().catch(()=>{});render();if(state.timerInterval)clearInterval(state.timerInterval);state.timerInterval=setInterval(timerTick,1000)};document.querySelector('#timer-stop').onclick=()=>{state.timerEnd=0;localStorage.removeItem('focusdesk-timer-end');clearInterval(state.timerInterval);state.timerInterval=null;render()};document.querySelector('#timer-preview').onclick=()=>{prepareAudio();ringBell();toast('If your volume is up, you should hear the chime.')}}else{document.querySelector('#reminder-form').onsubmit=addReminder;document.querySelectorAll('[data-remove-reminder]').forEach(button=>button.onclick=()=>{saveReminders(reminders().filter(item=>item.id!==button.dataset.removeReminder));render()})}}
function timerTick(){if(state.timerEnd<=Date.now()){state.timerEnd=0;localStorage.removeItem('focusdesk-timer-end');clearInterval(state.timerInterval);state.timerInterval=null;startAlarm('Your focus session is complete. Take a breath.');return}const summary=document.querySelector('#timer-summary');if(summary)summary.textContent=timerText();const display=document.querySelector('#timer-display');if(display)display.textContent=timerText().split(' · ').pop().replace(' left','');updateTimerRing()}
async function addReminder(e){e.preventDefault();prepareAudio();const form=new FormData(e.currentTarget),at=new Date(form.get('at'));if(at<=new Date()){document.querySelector('#reminder-error').textContent='Choose a time in the future.';return}const item={id:crypto.randomUUID(),label:form.get('label').trim(),at:at.toISOString(),notified:false};saveReminders([...reminders(),item]);if('Notification'in window&&Notification.permission==='default')try{await Notification.requestPermission()}catch{}render();toast('Reminder scheduled.')}
function checkReminders(){const items=reminders(),now=Date.now();let changed=false;for(const item of items){if(!item.notified&&new Date(item.at).getTime()<=now){item.notified=true;changed=true;startAlarm(item.label)}}if(changed){saveReminders(items);const summary=document.querySelector('#reminder-summary');if(summary)summary.textContent=items.length?`${items.length} scheduled`:'No reminders set'}}
function isOverdue(task){return task.dueDate&&!task.done&&task.dueDate<dayKey(new Date())}
async function load(){try{const result=await api('/api/me');state.user=result.user;const taskResult=await api('/api/tasks');state.tasks=taskResult.tasks;render()}catch{renderAuth()}}
function logo(){return `<div class="brandmark">✦</div><div class="brand-copy"><strong>FocusDesk</strong><small>Make room for focus</small></div>`}
function renderAuth(message=''){app.innerHTML=`<div class="auth-wrap"><section class="auth-card"><div class="brand">${logo()}</div><div class="eyebrow">A calmer way to get things done</div><h1>${state.authMode==='register'?'Create your workspace':'Welcome back'}</h1><p>${state.authMode==='register'?'Set up a private workspace for your tasks. Your account stays on this device.':'Sign in to pick up right where you left off.'}</p>${message?`<div class="error">${escapeHtml(message)}</div>`:''}<form id="auth-form"><div class="field"><label for="username">Username</label><input id="username" name="username" autocomplete="username" minlength="3" maxlength="20" pattern="[a-zA-Z0-9_-]+" placeholder="e.g. learner01" required></div><div class="field"><label for="password">Password</label><input id="password" name="password" type="password" autocomplete="${state.authMode==='register'?'new-password':'current-password'}" minlength="12" placeholder="At least 12 characters" required></div><button class="primary auth-submit" ${state.busy?'disabled':''}>${state.busy?'Please wait…':state.authMode==='register'?'Create my workspace':'Sign in'}</button></form><div class="auth-switch">${state.authMode==='register'?'Already have an account?':'New to FocusDesk?'} <button class="linkbtn" id="switch-auth">${state.authMode==='register'?'Sign in':'Create account'}</button></div><div class="auth-note">This is a personal task manager. Passwords are hashed on the server; the session token is kept in an HttpOnly cookie.</div></section></div>`;
document.querySelector('#switch-auth').onclick=()=>{state.authMode=state.authMode==='register'?'login':'register';renderAuth()};
document.querySelector('#auth-form').onsubmit=async e=>{e.preventDefault();const form=new FormData(e.currentTarget);state.busy=true;renderAuth();try{await api(`/api/${state.authMode}`,{method:'POST',body:JSON.stringify({username:form.get('username'),password:form.get('password')})});await load()}catch(err){state.busy=false;renderAuth(err.message)}}}
function viewTasks(){const active=state.tasks.filter(t=>!t.done),completed=state.tasks.filter(t=>t.done);if(state.view==='today')return state.tasks.filter(t=>!t.done&&(!t.dueDate||t.dueDate<=dayKey(new Date())));if(state.view==='upcoming')return active.filter(t=>t.dueDate&&t.dueDate>dayKey(new Date()));if(state.view==='completed')return completed;return state.view==='overview'?active:state.tasks}
const views=[['overview','⌂','Overview'],['today','◷','Today'],['upcoming','▦','Upcoming'],['all','☷','All tasks'],['completed','✓','Completed']];
function render(){const active=state.tasks.filter(t=>!t.done),completed=state.tasks.length-active.length,todayTasks=state.tasks.filter(t=>t.dueDate===dayKey(new Date())),todayDone=todayTasks.filter(t=>t.done).length,percent=todayTasks.length?Math.round(todayDone/todayTasks.length*100):0;
const list=viewTasks();const heading={overview:'Your overview',today:'Today',upcoming:'Coming up',all:'All tasks',completed:'Completed'}[state.view];
app.innerHTML=`<div class="shell"><aside><div class="brand">${logo()}</div><div class="section-label">Workspace</div><nav class="nav">${views.map(([id,icon,label])=>`<button data-view="${id}" class="${state.view===id?'active':''}"><span class="ico">${icon}</span><span class="label">${label}</span>${id==='today'?`<span class="count">${todayTasks.length||''}</span>`:''}${id==='upcoming'?`<span class="count">${active.filter(t=>t.dueDate&&t.dueDate>dayKey(new Date())).length||''}</span>`:''}</button>`).join('')}</nav><div class="side-bottom"><div class="tip"><b>Small steps add up.</b><p>Pick one important task and give it your full attention.</p></div><div class="userbox"><div class="avatar">${escapeHtml(state.user.username.slice(0,1).toUpperCase())}</div><div class="identity"><strong>${escapeHtml(state.user.username)}</strong><small>Your private workspace</small></div><button id="logout" title="Sign out">↗</button></div></div></aside><main><div class="topline"><span class="crumb">Workspace <span style="color:#c0c4bc">/</span> ${heading}</span><span class="todaydate">${dateLabel}</span></div><div class="greeting"><div><div class="eyebrow">A fresh start, every day</div><h1>${state.view==='overview'?'Good to see you, '+escapeHtml(state.user.username)+'.':heading}</h1><p>${state.view==='overview'?'A little progress is still progress. Here’s your day at a glance.':state.view==='today'?'Keep today clear and focused.':state.view==='upcoming'?'Make space for what’s coming next.':'Your tasks, organized in one quiet place.'}</p></div><button class="roundbtn" id="focus-btn">✧ &nbsp; Focus mode</button></div><section class="overview"><article class="hero-card"><div><h2>${percent===100&&todayTasks.length?'You showed up today.':'Keep your momentum'}</h2><p>${todayTasks.length?`${todayDone} of ${todayTasks.length} tasks scheduled for today complete.`:'Add a due date to a task to track your daily progress.'}</p></div><div class="progress" style="--percent:${percent}%"><span>${percent}%<small>today</small></span></div></article><article class="stats-card"><div><span class="stat-label">Tasks in your workspace</span><strong>${active.length}</strong><span class="stat-note">${completed} completed so far</span></div><div class="stat-icon">✧</div></article></section><section class="tools-row"><article class="tool-card"><div class="tool-icon">◷</div><div class="tool-info"><strong>Focus timer</strong><small id="timer-summary">${timerText()}</small></div><button id="open-timer">Start timer</button></article><article class="tool-card"><div class="tool-icon">♧</div><div class="tool-info"><strong>Reminders</strong><small id="reminder-summary">${reminders().length?`${reminders().length} scheduled`:'No reminders set'}</small></div><button id="open-reminders">Set reminder</button></article></section><section class="task-panel" style="padding:22px"><div class="panelhead"><div><h2>${heading}</h2><p>${list.length===1?'1 task':`${list.length} tasks`} ${state.view==='overview'?'to keep moving':''}</p></div>${state.view==='overview'?'<span class="badge">Your focus</span>':''}</div><form id="add-form" class="add-form"><input name="title" maxlength="140" placeholder="What would you like to get done?" aria-label="Task title" required><select name="priority" aria-label="Priority"><option value="normal">Normal priority</option><option value="urgent">Urgent</option><option value="high">High priority</option><option value="low">Low priority</option></select><input type="date" name="dueDate" aria-label="Due date"><button class="primary" ${state.busy?'disabled':''}>＋ &nbsp; Add task</button></form><div class="tasks">${list.length?list.map(taskCard).join(''):`<div class="empty"><div class="empty-icon">${state.view==='completed'?'✧':'☀'}</div><strong>${emptyTitle()}</strong>${emptySubtitle()}</div>`}</div></section><div class="footer">A little more focus. A little less noise.</div></main></div>${state.dialog?dialogMarkup():''}`;
document.querySelectorAll('[data-view]').forEach(el=>el.onclick=()=>{state.view=el.dataset.view;render()});document.querySelector('#logout').onclick=logout;document.querySelector('#add-form').onsubmit=addTask;document.querySelector('#focus-btn').onclick=focusMode;document.querySelector('#open-timer').onclick=()=>{state.dialog='timer';render()};document.querySelector('#open-reminders').onclick=()=>{state.dialog='reminders';render()};bindDialog();document.querySelectorAll('[data-done]').forEach(el=>el.onclick=()=>toggleTask(el.dataset.done));document.querySelectorAll('[data-delete]').forEach(el=>el.onclick=()=>deleteTask(el.dataset.delete));document.querySelectorAll('[data-edit]').forEach(el=>el.onclick=()=>{state.editing=state.editing===el.dataset.edit?null:el.dataset.edit;render()});document.querySelectorAll('[data-save]').forEach(el=>el.onclick=()=>saveTask(el.dataset.save));document.querySelectorAll('[data-cancel]').forEach(el=>el.onclick=()=>{state.editing=null;render()})}
function taskCard(task){if(state.editing===task.id)return `<article class="task task-edit" data-task="${task.id}"><input id="edit-title" value="${escapeHtml(task.title)}" maxlength="140" aria-label="Task title"><input id="edit-date" type="date" value="${task.dueDate||''}" aria-label="Due date"><select id="edit-priority" aria-label="Priority">${['normal','urgent','high','low'].map(p=>`<option value="${p}" ${task.priority===p?'selected':''}>${p[0].toUpperCase()+p.slice(1)}</option>`).join('')}</select><button class="primary" data-save="${task.id}">Save</button><button class="roundbtn" data-cancel>Cancel</button></article>`;return `<article class="task ${task.done?'done':''}"><button class="check" data-done="${task.id}" aria-label="${task.done?'Mark incomplete':'Mark complete'}">${task.done?'✓':''}</button><div><div class="task-title">${escapeHtml(task.title)}</div><div class="task-meta"><span class="badge ${task.priority||'normal'}">${task.priority||'normal'}</span><span class="due ${isOverdue(task)?'overdue':''}">${task.dueDate?`${isOverdue(task)?'Overdue · ':''}${fmtDate(task.dueDate)}`:'No due date'}</span></div></div><div class="task-actions"><button class="iconbtn" data-edit="${task.id}" aria-label="Edit task">✎</button><button class="iconbtn" data-delete="${task.id}" aria-label="Delete task">×</button></div></article>`}
function emptyTitle(){return {overview:'Your task list is clear.',today:'Nothing due today.',upcoming:'No upcoming tasks yet.',all:'No tasks yet.',completed:'Nothing completed yet.'}[state.view]}
function emptySubtitle(){return {overview:'Add a task above and give your day a little direction.',today:'Add something above, or set a due date for today.',upcoming:'Add a future due date to plan ahead.',all:'Add your first task above to get started.',completed:'Finish a task and it will be waiting here.'}[state.view]}
function toast(message){const el=document.createElement('div');el.className='toast';el.textContent=message;document.body.append(el);setTimeout(()=>el.remove(),2400)}
async function addTask(e){e.preventDefault();const form=new FormData(e.currentTarget);state.busy=true;try{const result=await api('/api/tasks',{method:'POST',body:JSON.stringify({title:form.get('title'),priority:form.get('priority'),dueDate:form.get('dueDate')||null})});state.tasks.unshift(result.task);state.busy=false;render();toast('Task added to your workspace.')}catch(err){toast(err.message);state.busy=false;render()}}
async function toggleTask(id){const task=state.tasks.find(t=>t.id===id);try{const r=await api(`/api/tasks/${id}`,{method:'PATCH',body:JSON.stringify({done:!task.done})});Object.assign(task,r.task);render()}catch(e){toast(e.message)}}
async function deleteTask(id){try{await api(`/api/tasks/${id}`,{method:'DELETE'});state.tasks=state.tasks.filter(t=>t.id!==id);render();toast('Task removed.')}catch(e){toast(e.message)}}
async function saveTask(id){const task=state.tasks.find(t=>t.id===id);try{const r=await api(`/api/tasks/${id}`,{method:'PATCH',body:JSON.stringify({title:document.querySelector('#edit-title').value,priority:document.querySelector('#edit-priority').value,dueDate:document.querySelector('#edit-date').value||null})});Object.assign(task,r.task);state.editing=null;render();toast('Task details updated.')}catch(e){toast(e.message)}}
async function logout(){try{await api('/api/logout',{method:'POST'});state.user=null;state.tasks=[];state.authMode='login';renderAuth();toast('You are signed out.')}catch(e){toast(e.message)}}
function focusMode(){document.body.classList.toggle('focus');const on=document.body.classList.contains('focus');document.querySelector('aside').style.display=on?'none':'';document.querySelector('.shell').style.gridTemplateColumns=on?'1fr':'';document.querySelector('main').style.maxWidth=on?'850px':'';document.querySelector('#focus-btn').textContent=on?'✕  Exit focus':'✧  Focus mode'}
setInterval(checkReminders,1000);if(state.timerEnd> Date.now())state.timerInterval=setInterval(timerTick,1000);else if(state.timerEnd){state.timerEnd=0;localStorage.removeItem('focusdesk-timer-end')}load();
</script></body></html>
